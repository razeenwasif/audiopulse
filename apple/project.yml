name: AudioPulse
options:
  bundleIdPrefix: dev.audiopulse
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AudioPulse-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: AudioPulse turns what you say into a music request on this Mac.
        PRODUCT_NAME: AudioPulse
        PRODUCT_BUNDLE_IDENTIFIER: dev.audiopulse.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AudioPulse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSMicrophoneUsageDescription: AudioPulse listens when you hold V or press the mic, so you can ask for music by voice.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
  AudioPulse-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - Info.plist
    dependencies:
      - package: SpotifyiOS
    settings:
      base:
        INFOPLIST_FILE: iOS/Info.plist
        SPOTIFY_CLIENT_ID: ""
        PRODUCT_NAME: AudioPulse
        PRODUCT_BUNDLE_IDENTIFIER: dev.audiopulse.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AudioPulse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: AudioPulse listens when you tap the mic, so you can ask for music by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: AudioPulse turns what you say into a music request on this iPhone.
        INFOPLIST_KEY_NSCameraUsageDescription: To scan Fairy’s pairing code on your Mac.
        TARGETED_DEVICE_FAMILY: "1"
